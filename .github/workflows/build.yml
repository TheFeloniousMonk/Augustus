name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # macOS Intel — runs natively on Intel hardware so PyInstaller emits
          # an x86_64 backend. Fixes issue #6 (x64 dmg shipping arm64 backend).
          - os: macos-13
            platform: mac-x64
            mac_arch: x64
            lipo_arch: x86_64
          - os: macos-15
            platform: mac-arm64
            mac_arch: arm64
            lipo_arch: arm64
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Install Python dependencies + PyInstaller
      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install "pyinstaller>=6.0.0"

      # Bundle Python backend with PyInstaller
      - name: Build backend (PyInstaller)
        run: python build_backend.py
        working-directory: backend

      # Verify PyInstaller output exists
      - name: Verify backend build
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            test -f backend/dist/augustus/augustus.exe && echo "Backend binary found" || (echo "Backend binary NOT found!" && exit 1)
          else
            test -f backend/dist/augustus/augustus && echo "Backend binary found" || (echo "Backend binary NOT found!" && exit 1)
          fi

      # Guard against issue #6: the dmg's bundled backend must match the
      # advertised architecture, or Intel users get spawn ENOEXEC (-86).
      - name: Verify backend architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXPECTED="${{ matrix.lipo_arch }}"
          ACTUAL=$(lipo -archs backend/dist/augustus/augustus)
          echo "Backend arch: $ACTUAL (expected: $EXPECTED)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Backend binary arch mismatch — built $ACTUAL, expected $EXPECTED"
            exit 1
          fi

      # Build frontend (Vite)
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Build Electron app — publish never; artifacts uploaded separately
      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Build Electron app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Restrict the build to this runner's native arch so we don't
            # cross-bundle the wrong PyInstaller backend (see issue #6).
            npx electron-builder --mac --arch ${{ matrix.mac_arch }} --publish never
          else
            npx electron-builder --publish never
          fi
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (configure these secrets when ready):
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Windows code signing:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Build .mcpb Desktop Extension
      - name: Build MCP Desktop Extension (.mcpb)
        run: python mcp-extension/build-mcpb.py

      # Collect built artifacts into a staging directory
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p staging
          # Copy release files (installers, blockmaps, latest ymls) but not unpacked dirs
          find electron/dist -maxdepth 1 -type f \( \
            -name "*.exe" -o -name "*.exe.blockmap" \
            -o -name "*.dmg" -o -name "*.dmg.blockmap" \
            -o -name "*.AppImage" \
            -o -name "latest*.yml" \
          \) -exec cp {} staging/ \;
          # The two macOS jobs each emit their own latest-mac.yml listing only
          # their arch — rename per-arch so they survive merge-multiple in the
          # publish job, which combines them into one canonical file.
          if [ "$RUNNER_OS" = "macOS" ] && [ -f staging/latest-mac.yml ]; then
            mv staging/latest-mac.yml staging/latest-mac-${{ matrix.mac_arch }}.yml
          fi
          # Copy .mcpb Desktop Extension
          cp mcp-extension/*.mcpb staging/ 2>/dev/null || true
          echo "Staged files:"
          ls -lh staging/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: staging/
          retention-days: 1

  # Publish release after ALL platform builds complete — no race condition
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh dist/

      # Combine the per-arch latest-mac yml files into one canonical
      # latest-mac.yml whose files[] lists both arm64 and x64 dmgs, so
      # electron-updater can serve the right binary to each user.
      - name: Merge macOS auto-update manifests
        shell: bash
        run: |
          shopt -s nullglob
          mac_ymls=(dist/latest-mac-*.yml)
          if [ ${#mac_ymls[@]} -eq 0 ]; then
            echo "No per-arch latest-mac yml files — skipping merge"
            exit 0
          fi
          python3 -m pip install --quiet pyyaml
          python3 - "${mac_ymls[@]}" <<'PY'
          import os, sys, yaml
          sources = sys.argv[1:]
          base = None
          files = []
          for path in sources:
              with open(path) as f:
                  data = yaml.safe_load(f)
              if base is None:
                  base = dict(data)
              files.extend(data.get("files", []))
              # Use the newest releaseDate across inputs
              if data.get("releaseDate", "") > base.get("releaseDate", ""):
                  base["releaseDate"] = data["releaseDate"]
          # Dedupe files[] by url, preserving order
          seen, deduped = set(), []
          for entry in files:
              url = entry.get("url")
              if url in seen:
                  continue
              seen.add(url)
              deduped.append(entry)
          base["files"] = deduped
          # Prefer arm64 as the top-level path/sha512 default since it's the
          # majority of macOS installs; electron-updater uses files[] to pick
          # the actual download, this is just legacy fallback.
          arm = next((e for e in deduped if "arm64" in (e.get("url") or "")), None)
          if arm:
              base["path"] = arm["url"]
              base["sha512"] = arm["sha512"]
          out = "dist/latest-mac.yml"
          with open(out, "w") as f:
              yaml.safe_dump(base, f, sort_keys=False)
          for path in sources:
              os.remove(path)
          print(f"Merged {len(sources)} manifests into {out}:")
          with open(out) as f:
              print(f.read())
          PY

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "$TAG" \
            --generate-notes \
            dist/*
          echo "Release $TAG published with all artifacts."
